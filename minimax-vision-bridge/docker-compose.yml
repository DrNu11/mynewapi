services:
  minimax-vision-bridge:
    build: .
    image: minimax-vision-bridge:latest
    container_name: minimax-vision-bridge
    restart: unless-stopped
    ports:
      - "${BRIDGE_HOST_IP:-0.0.0.0}:${BRIDGE_HTTP_PORT:-3001}:3000"
    environment:
      NEWAPI_UPSTREAM: ${NEWAPI_UPSTREAM:-http://newapi-prod-new-api-1:3000}
      MINIMAX_API_HOST: ${MINIMAX_API_HOST:-https://api.minimaxi.com}
      MINIMAX_VLM_API_KEY: ${MINIMAX_VLM_API_KEY}
      BRIDGE_MODE: ${BRIDGE_MODE:-front}
      VISION_BRIDGE_MODEL_PREFIXES: ${VISION_BRIDGE_MODEL_PREFIXES:-deepseek-v4-,MiniMax-}
      PROVIDER_MODEL_MAP_JSON: '${PROVIDER_MODEL_MAP_JSON:-{"deepseek-v4-flash":"MiniMax-M2.5-highspeed","deepseek-v4-pro":"MiniMax-M2.7"}}'
      VISION_BRIDGE_MAX_IMAGES: ${VISION_BRIDGE_MAX_IMAGES:-4}
      VISION_BRIDGE_IMAGE_MAX_BYTES: ${VISION_BRIDGE_IMAGE_MAX_BYTES:-8388608}
    networks:
      - newapi-prod-net
    healthcheck:
      test: ["CMD-SHELL", "python - <<'PY'\nimport urllib.request\nurllib.request.urlopen('http://127.0.0.1:3000/health/ready', timeout=3).read()\nPY"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  newapi-prod-net:
    external: true
