[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatgpt2cpa"
version = "0.1.0"
description = "Local OpenAI/Codex session exporter for CPA and sub2api payloads"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "WTFGEDelphia" }]
keywords = ["openai", "codex", "chatgpt", "fastapi", "token"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "jinja2>=3.1,<4.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.urls]
Homepage = "https://github.com/WTFGEDelphia/chatgpt2cpa"
Repository = "https://github.com/WTFGEDelphia/chatgpt2cpa"
Issues = "https://github.com/WTFGEDelphia/chatgpt2cpa/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2,<2.0",
  "httpx>=0.27,<1.0",
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<6.0",
  "twine>=5.1,<6.0",
]

[project.scripts]
chatgpt2cpa = "chatgpt2cpa.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chatgpt2cpa = ["templates/*.html", "static/*.css", "static/*.js"]
