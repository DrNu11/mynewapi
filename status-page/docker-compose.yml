services:
  status-page:
    build: .
    image: nassa-status-page:latest
    container_name: nassa-status-page
    restart: unless-stopped
    ports:
      - "8200:8000"
    environment:
      MYSQL_HOST: newapi-prod-mysql-1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: new-api
      REALTIME_WINDOW: "300"
      HISTORY_HOURS: "48"
      BUCKET_SECONDS: "3600"
      REFRESH_SECONDS: "30"
      MINIMAX_TOKEN_PLANS_JSON: ${MINIMAX_TOKEN_PLANS_JSON:-}
      MINIMAX_REFRESH_SECONDS: ${MINIMAX_REFRESH_SECONDS:-30}
      MINIMAX_TIMEOUT_SECONDS: ${MINIMAX_TIMEOUT_SECONDS:-10}
      GPT_TOKEN_PLANS_JSON: ${GPT_TOKEN_PLANS_JSON:-}
      GPT_USAGE_DB: ${GPT_USAGE_DB:-/app/data/gpt-usage.db}
      GPT_REFRESH_SECONDS: ${GPT_REFRESH_SECONDS:-30}
      GPT_TIMEOUT_SECONDS: ${GPT_TIMEOUT_SECONDS:-10}
      MINIMAX_CHANNEL_IDS: ${MINIMAX_CHANNEL_IDS:-49,56,59,71}
      MINIMAX_PLAN_CHANNELS_JSON: '${MINIMAX_PLAN_CHANNELS_JSON:-{"mm-a":[49],"mm-b":[59],"mm-c":[56],"mm-d":[71]}}'
      MINIMAX_AUTO_DISABLE_WEEKLY_PERCENT: ${MINIMAX_AUTO_DISABLE_WEEKLY_PERCENT:-99}
      MINIMAX_AUTO_REENABLE_WEEKLY_PERCENT: ${MINIMAX_AUTO_REENABLE_WEEKLY_PERCENT:-95}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-465}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      ALERT_SMTP_SSL: ${ALERT_SMTP_SSL:-true}
      ALERT_SMTP_STARTTLS: ${ALERT_SMTP_STARTTLS:-false}
      ALERT_INTERVAL_SECONDS: ${ALERT_INTERVAL_SECONDS:-60}
      ALERT_COOLDOWN_SECONDS: ${ALERT_COOLDOWN_SECONDS:-1800}
      ALERT_MINIMAX_WEEKLY_WARN_PERCENT: ${ALERT_MINIMAX_WEEKLY_WARN_PERCENT:-85}
      ALERT_MINIMAX_FIVE_HOUR_WARN_PERCENT: ${ALERT_MINIMAX_FIVE_HOUR_WARN_PERCENT:-85}
      ALERT_GPT_SUCCESS_RATE_WARN: ${ALERT_GPT_SUCCESS_RATE_WARN:-80}
      ALERT_SUCCESS_RATE_WARN: ${ALERT_SUCCESS_RATE_WARN:-95}
      ALERT_MIN_REQUESTS_FOR_RATE: ${ALERT_MIN_REQUESTS_FOR_RATE:-20}
      ALERT_STATE_DB: ${ALERT_STATE_DB:-/app/data/alert_state.json}
      MINIMAX_CHANNEL_STATE_DB: ${MINIMAX_CHANNEL_STATE_DB:-/app/data/minimax_channel_state.json}
      MINIMAX_PLAN_STATE_DB: ${MINIMAX_PLAN_STATE_DB:-/app/data/minimax_plan_state.json}
      MOCK_MODE: "0"
    volumes:
      - ./data:/app/data
      # 静态前端 bind mount,改完 index.html 立刻生效无需重启
      - ./static:/app/static:ro
      # 只读挂载 cpa-usage-keeper 的统计库,用于 GPT Plan 状态卡
      - ${GPT_USAGE_DB_HOST:-/root/cpa-keeper-8317/data/app.db}:${GPT_USAGE_DB:-/app/data/gpt-usage.db}:ro
      # 只读挂载 docker socket(让容器能 tail 兄弟容器日志)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      # 让容器能用 host.docker.internal 访问 host 上的服务(CPA/cards/host-network 容器)
      - "host.docker.internal:host-gateway"
    networks:
      # 加入 newapi 同一网络,直接用容器名访问 mysql
      - newapi-prod-net

networks:
  newapi-prod-net:
    external: true
