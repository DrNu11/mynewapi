# ============================================================
# 在 gopay.nassa.space 的两个 server 块（80 与 443）里
# 都把下面三段插在 `location / { ... }` **之前**。
# Nginx 用最长前缀匹配 + 精确匹配优先，必须放在 / 之前。
# ============================================================

# 升级申请页（静态）：访问 https://gopay.nassa.space/upgrade/
location /upgrade/ {
    alias /opt/upgrade-api/static/;
    index index.html;
    try_files $uri $uri/ /upgrade/index.html;
}

# 兼容不带斜杠的访问：/upgrade -> /upgrade/
location = /upgrade {
    return 301 /upgrade/;
}

# 管理面板（静态）：访问 https://gopay.nassa.space/admin
location = /admin {
    alias /opt/upgrade-api/static/admin.html;
}
location = /admin.js {
    alias /opt/upgrade-api/static/admin.js;
}
location = /admin.css {
    alias /opt/upgrade-api/static/admin.css;
}

# 后端 API：业务 + OTA
location /api/upgrade/ {
    proxy_pass http://127.0.0.1:7889;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/admin/ {
    proxy_pass http://127.0.0.1:7889;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# OTA 接口：需要更大 body（zip 上传）+ 更长超时（部署可能 1-2 分钟）+ 关闭缓冲（SSE 日志）
location /api/ota/ {
    proxy_pass http://127.0.0.1:7889;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 250M;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection '';
    chunked_transfer_encoding on;
}

location = /api/health {
    proxy_pass http://127.0.0.1:7889;
}
