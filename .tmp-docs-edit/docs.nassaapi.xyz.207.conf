server {
    listen 80;
    listen [::]:80;
    server_name docs.nassaapi.xyz;

    root /opt/nassa-docs/dist;
    index index.html;

    add_header Cache-Control "no-cache, must-revalidate";

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8088;
    listen [::]:8088;
    server_name _;

    root /opt/nassa-docs/dist;
    index index.html;

    add_header Cache-Control "no-cache, must-revalidate";

    location / {
        try_files $uri $uri/ /index.html;
    }
}
